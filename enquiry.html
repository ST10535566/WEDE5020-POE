	<h1> Contact Form</h1>
	<form onsubmit="return validateForm()">
	<label for="name">Name:</label>
	<input type="text" id="name" placeholder="Enter first name">
	<label for="surname">Surname:</label>
	<input type="text" id="surname" placeholder="Enter last name">
	<label for="email">Email:</label>
	<input type="email" id="email" placeholder="Enter email adress">
	<textarea rows="5" cols="60" name="message" placeholder="enter text" ></textarea>
	<button type="submit"> send message</button>
	</form>

<script>
	function validateForm() {
		let name =
		document.getElementById("name").value;

//Allowing only letters and spaces to appear
		let lettersOnly= /^[A-Za-z]+$/;

	if(!lettersOnly.test(name)){
		alert("Invalid. Enter Text");
		return false; //stops the submission of the text
	}

	return true; //allows the submission
}
</script>
